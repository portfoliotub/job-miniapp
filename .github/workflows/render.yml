name: render-jobs
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install
        working-directory: render
      - run: node render-job.mjs
        working-directory: render
        env:
          WORKER_URL: https://html-to-video-bot.1ravixo.workers.dev
